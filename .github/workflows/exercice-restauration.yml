# Exercice de restauration (spec §8.3) : restaure la dernière VRAIE sauvegarde dans une base
# Supabase jetable (dans Docker, sur la machine de GitHub), puis affiche un compte rendu
# (nombres seulement). Rien n'est modifié sur le staging.
#
# La clé privée n'est jamais gardée dans GitHub : pour l'exercice, un admin l'ajoute comme
# secret SAUVEGARDE_CLE_PRIVEE, lance ce workflow, puis supprime le secret.
# Mode d'emploi : docs/sauvegardes.md.
name: Exercice de restauration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restaurer:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Client PostgreSQL 17
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt
      - name: Base jetable avec le schéma du dépôt
        run: |
          supabase db start
          supabase db reset --local
      - name: Restaurer la dernière sauvegarde
        working-directory: worker
        env:
          CLE: ${{ secrets.SAUVEGARDE_CLE_PRIVEE }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
          B2_REGION: ${{ vars.B2_REGION }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          if [ -z "$CLE" ]; then
            echo "::error::Secret SAUVEGARDE_CLE_PRIVEE absent : voir docs/sauvegardes.md."
            exit 1
          fi
          umask 077
          printf '%s\n' "$CLE" > "$RUNNER_TEMP/cle.txt"
          python -m murya_worker.restore --cle "$RUNNER_TEMP/cle.txt" \
            --base postgresql://postgres:postgres@127.0.0.1:54322/postgres
          rm -f "$RUNNER_TEMP/cle.txt"
