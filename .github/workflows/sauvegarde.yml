# Sauvegarde chiffrée de nuit (spec §8.3) : base + audios + consentements oraux → Backblaze B2.
# Voir docs/sauvegardes.md (ce qui est gardé, combien de temps, comment restaurer).
#
# Inactive tant que la variable de dépôt SAUVEGARDE_ENABLED ne vaut pas "true".
# Tourne pour chaque environnement GitHub (« staging », « production ») déjà configuré ; un
# environnement sans ses clés est sauté. Dans chacun :
#   secrets   : SUPABASE_DB_URL, SAUVEGARDE_R2_ACCESS_KEY_ID, SAUVEGARDE_R2_SECRET_ACCESS_KEY,
#               B2_KEY_ID, B2_APPLICATION_KEY
#   variables : R2_ACCOUNT_ID, R2_BUCKET_AUDIO, R2_BUCKET_IDENTITES, B2_ENDPOINT, B2_REGION,
#               B2_BUCKET, AGE_RECIPIENTS (clé publique : la clé privée n'est JAMAIS dans GitHub)
name: Sauvegarde

on:
  schedule:
    - cron: '30 1 * * *' # chaque nuit à 1 h 30 UTC (2 h 30 à Niamey)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sauvegarder:
    if: vars.SAUVEGARDE_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        environnement: [staging, production]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environnement }}
    concurrency:
      group: sauvegarde-${{ matrix.environnement }}
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - name: Environnement prêt ?
        id: pret
        env:
          CLE: ${{ secrets.B2_KEY_ID }}
        run: |
          if [ -n "$CLE" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "Environnement « ${{ matrix.environnement }} » pas encore configuré : rien à faire."; fi
      - uses: actions/checkout@v5
        if: steps.pret.outputs.ok == 'true'
      - name: Client PostgreSQL 17 (même version que la base)
        if: steps.pret.outputs.ok == 'true'
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        if: steps.pret.outputs.ok == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt
        if: steps.pret.outputs.ok == 'true'
      - name: Sauvegarder (le compte rendu ne contient que des nombres)
        if: steps.pret.outputs.ok == 'true'
        working-directory: worker
        run: python -m murya_worker.backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_AUDIO: ${{ vars.R2_BUCKET_AUDIO }}
          R2_BUCKET_IDENTITES: ${{ vars.R2_BUCKET_IDENTITES }}
          R2_ACCESS_KEY_ID: ${{ secrets.SAUVEGARDE_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.SAUVEGARDE_R2_SECRET_ACCESS_KEY }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
          B2_REGION: ${{ vars.B2_REGION }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AGE_RECIPIENTS: ${{ vars.AGE_RECIPIENTS }}
