# Worker Python (vérifications audio côté serveur, spec §6.2), lancé toutes les 15 minutes.
# Gratuit tant que le dépôt est public. Le délai entre deux lancements n'est pas garanti par
# GitHub (souvent quelques minutes de plus) : sans conséquence, ces vérifications servent à
# l'équipe, pas aux voix.
#
# Inactif tant que la variable de dépôt WORKER_ENABLED ne vaut pas "true".
# Tourne pour chaque environnement GitHub (« staging », « production ») déjà configuré ; un
# environnement sans ses clés est sauté. Dans chacun :
#   secrets   : SUPABASE_SECRET_KEY, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   variables : SUPABASE_URL, R2_ACCOUNT_ID, R2_BUCKET_AUDIO
name: Worker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier-audios:
    if: vars.WORKER_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        environnement: [staging, production]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environnement }}
    concurrency:
      group: worker-${{ matrix.environnement }}
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Environnement prêt ?
        id: pret
        env:
          CLE: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          if [ -n "$CLE" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "Environnement « ${{ matrix.environnement }} » pas encore configuré : rien à faire."; fi
      - uses: actions/checkout@v5
        if: steps.pret.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.pret.outputs.ok == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - run: pip install -r worker/requirements.txt
        if: steps.pret.outputs.ok == 'true'
      - name: Traiter les tâches en attente
        if: steps.pret.outputs.ok == 'true'
        working-directory: worker
        run: python -m murya_worker --max-minutes 12
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET_AUDIO: ${{ vars.R2_BUCKET_AUDIO }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
