# Vérifications automatiques à chaque push et pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parcours-voix:
    name: Parcours complet d'une voix (navigateur)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  verifications:
    name: Format, types, tests, build, budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Budget de poids de l'app de la voix
        run: npm run budget

  migrations-supabase:
    # Les tests utilisent PGlite ; ici on applique aussi les migrations sur le vrai
    # Postgres de Supabase (dans Docker) et on lance ses vérifications de sécurité.
    name: Migrations sur le Postgres de Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Démarrer Postgres et appliquer les migrations
        run: |
          supabase db start
          supabase db reset --local
      - name: Vérifier le SQL
        run: supabase db lint --local --fail-on error
      - name: Conseils de sécurité de Supabase
        run: supabase db advisors --local --type security --fail-on error

  worker-python:
    name: Tests du worker Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt
      - run: pip install -r worker/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: worker

  sauvegarde-restauration:
    # Test de restauration de bout en bout (spec §8.3) : sauvegarde du vrai Postgres de
    # Supabase, base effacée, restauration, vérifications. Voir docs/sauvegardes.md.
    name: Sauvegarde et restauration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Client PostgreSQL 17 (même version que la base)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt
      - run: pip install -r worker/requirements-dev.txt
      - run: supabase db start
      - name: Sauvegarder, effacer la base, restaurer
        working-directory: worker
        env:
          MURYA_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: python -m pytest -q -rs tests/test_backup_integration.py
